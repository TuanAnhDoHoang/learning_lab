version: "3.8"

services:
  # Database PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: learning_lab_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - ./server/.env
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API Server (Rust)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: learning_lab_server
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      URL: "0.0.0.0:3000"
      RUST_LOG: info

  # Frontend Web App + Nginx Reverse Proxy
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: learning_lab_app
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata: {}
