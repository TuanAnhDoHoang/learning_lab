name: CI - Build Docker Services

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  build:
    name: Build App & Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create env file
        run: |
          mkdir -p server
          # Các biến cho Database container
          echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> server/.env
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> server/.env
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> server/.env
          
          # Các biến cho Server container (Rust)
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> server/.env
          echo "ADMIN_ROUTE=${{ secrets.ADMIN_ROUTE }}" >> server/.env
          echo "SECRET=${{ secrets.SECRET }}" >> server/.env
          echo "URL=${{ secrets.URL }}" >> server/.env
          echo "PGDATA=${{ secrets.PGDATA }}" >> server/.env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> server/.env
          echo "GEMINI_MODEL=${{ secrets.GEMINI_MODEL }}" >> server/.env

      - name: Build all services
        run: docker compose build --no-cache

      - name: Start services
        run: docker compose up -d

      - name: Wait for database to be ready
        run: |
          for i in {1..30}; do
            if docker compose exec -T db pg_isready -U "${{ secrets.POSTGRES_USER }}" -d "${{ secrets.POSTGRES_DB }}" >/dev/null 2>&1; then
              echo "Database is ready"
              exit 0
            fi
            echo "Attempt $i/30: waiting for Postgres..."
            sleep 5
          done
          echo "Postgres did not become ready in time"
          docker compose logs --tail=200 db
          exit 1

      - name: Print Server Logs for Debugging
        run: docker compose logs server

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        
      - name: Run server API tests
        working-directory: ./server # Đổi lại nếu thư mục chứa file Cargo.toml của bạn có tên khác
        env:
          # Cấu hình biến môi trường kết nối với Postgres đang chạy trong Docker
          DATABASE_URL: "postgres://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}"
        run: cargo test --test api -- --nocapture

      - name: Wait for app to become ready
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5173 >/dev/null && curl -fsS http://localhost:3000 >/dev/null; then
              echo "Services are ready"
              exit 0
            fi
            echo "Attempt $i/30: waiting for app and server..."
            sleep 5
          done
          echo "Services did not become ready in time"
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Verify compose configuration
        run: |
          docker compose config
          docker images

      - name: Stop services
        if: always()
        run: docker compose down -v